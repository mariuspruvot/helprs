site_name: helPRs
site_description: Pluggable AI skill runner for pull requests
site_url: https://helprs.dev/docs

repo_name: helprs
repo_url: https://github.com/marius-pruvot/helprs

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  logo: assets/logo.svg

  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  font:
    text: Inter
    code: IBM Plex Mono

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Overview: project-overview.md
  - Architecture:
      - Backend (API): architecture-api.md
      - Frontend (Web): architecture-web.md
      - Infrastructure: architecture-infra.md
      - Integration: integration-architecture.md
  - Reference:
      - API Contracts: api-contracts-api.md
      - Data Models: data-models-api.md
      - Component Inventory: component-inventory-web.md
      - Source Tree: source-tree-analysis.md
  - Guides:
      - Development: development-guide.md
      - Deployment: deployment-guide.md
  - ADRs:
      - "001: Claude Code Container Pivot": adr-001-claude-code-container-pivot.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marius-pruvot/helprs
  generator: false
