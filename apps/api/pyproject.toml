[project]
name = "helprs"
version = "0.1.0"
description = "helPRs API — Socratic comprehension sessions for pull requests"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "sqladmin>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2.0",
    "aiodocker>=0.23.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helprs"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# RUF100 flags noqa directives that no longer suppress anything, so they
# cannot silently accumulate. (Beware: `ruff check --select RUF100` on the
# command line *replaces* this selection, which makes every noqa look dead.)
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Alembic's env.py must configure the connection before importing the models
# it auto-discovers.
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Per-module overrides for third-party lib typing issues (aiodocker, SQLAlchemy, Starlette)
[[tool.mypy.overrides]]
module = ["helprs.main"]
disable_error_code = ["arg-type", "call-overload", "attr-defined"]

[[tool.mypy.overrides]]
module = ["helprs.core.middleware"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["helprs.modules.webhook.repository", "helprs.modules.webhook.verification"]
disable_error_code = ["attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = ["helprs.modules.installation.service"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
