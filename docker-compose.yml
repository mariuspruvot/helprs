services:
  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/Dockerfile.api
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - /var/run/docker.sock:/var/run/docker.sock
      - ./skills:/app/skills:ro
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://helprs:helprs@db:5432/helprs
      - SKILLS_HOST_PATH=${PWD}/skills
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && uv run uvicorn helprs.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    command: npx vite --host 0.0.0.0 --port 5173

  # Build-only service: the API spawns containers from this image dynamically
  # via the Docker socket. `entrypoint: /bin/true` + `restart: "no"` make the
  # container exit immediately — the image stays available on the host.
  claude-runner:
    build:
      context: ./infra/docker/claude-runner
    image: claude-runner:latest
    entrypoint: ["/bin/true"]
    restart: "no"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: helprs
      POSTGRES_USER: helprs
      POSTGRES_PASSWORD: helprs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helprs"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
