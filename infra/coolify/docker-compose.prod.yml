services:
  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/Dockerfile.api
      target: production
    expose:
      - "8000"
    group_add:
      - "${DOCKER_GID:-994}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./skills:/app/skills:ro
    environment:
      - ENVIRONMENT=production
      - SKILLS_HOST_PATH=${SKILLS_HOST_PATH}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APP_BASE_URL=${APP_BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - FERNET_KEY=${FERNET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - CONTAINER_TTL_SECONDS=${CONTAINER_TTL_SECONDS}
      - UVICORN_WORKERS=${UVICORN_WORKERS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GITHUB_APP_SLUG: ${VITE_GITHUB_APP_SLUG}
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped

  # Build-only service: the API spawns containers from this image dynamically
  # via the Docker socket. We still declare it here so `docker compose up --build`
  # produces the image; `entrypoint: /bin/true` + `restart: "no"` make the
  # container exit immediately without becoming a long-lived service. The image
  # `claude-runner:latest` then stays available on the host for the API to use.
  # Image tag is hard-coded in helprs/modules/container/service.py.
  claude-runner:
    build:
      context: ./infra/docker/claude-runner
    image: claude-runner:latest
    entrypoint: ["/bin/true"]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helprs}
      POSTGRES_USER: ${POSTGRES_USER:-helprs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helprs}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # Daily pg_dump into a host directory outside the pgdata volume, so a dump
  # survives losing or deleting the database volume. Dumps once on start, then
  # every BACKUP_INTERVAL_SECONDS, keeping the newest BACKUP_KEEP files.
  # Any failure exits the container (set -e) and shows up as a restart loop.
  # `$$` escapes `$` from compose interpolation so the shell sees it.
  db-backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-helprs}
      PGUSER: ${POSTGRES_USER:-helprs}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_HOST_PATH:-/data/backups/helprs}:/backups
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        while true; do
          rm -f /backups/helprs_*.dump.tmp
          dump="/backups/helprs_$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --file="$$dump.tmp"
          mv "$$dump.tmp" "$$dump"
          echo "backup written: $$dump ($$(du -h "$$dump" | cut -f1))"
          ls -1t /backups/helprs_*.dump | tail -n +"$$((BACKUP_KEEP + 1))" | xargs -r rm -f --
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

volumes:
  pgdata:
